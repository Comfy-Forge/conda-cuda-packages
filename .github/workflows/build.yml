name: build

# Every workflow_dispatch input is routed through `env:` and referenced as a
# shell variable. A raw ${{ inputs.x }} inside a `run:` block is substituted as
# TEXT before bash parses the line, so an input containing `"; cmd; y="` breaks
# out of the quoting and executes (CWE-78). conda-torch shipped that bug across
# ~10 call sites before it was found; this repo starts without it.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package folder or name (e.g. cc_torch), or "all"'
        default: "cc_torch"
      cuda:
        description: 'CUDA flavour filter, e.g. 12.8 (or "all")'
        default: "all"
      pytorch:
        description: 'torch minor filter, e.g. 2.11 (or "all")'
        default: "all"
      python:
        description: 'python minor filter, e.g. 3.12 (or "all")'
        default: "all"
      build_number:
        description: "build number (bump to republish with fixed metadata)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.package }}-${{ inputs.cuda }}-${{ inputs.pytorch }}-${{ inputs.python }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.gen.outputs.compile }}
      link: ${{ steps.gen.outputs.link }}
    env:
      IN_PACKAGE: ${{ inputs.package }}
      IN_CUDA: ${{ inputs.cuda }}
      IN_PYTORCH: ${{ inputs.pytorch }}
      IN_PYTHON: ${{ inputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml jinja2
      - name: Recipes must be in sync with package.yml
        run: python scripts/generate_recipes.py --check
      - name: Generate matrix from the conda-torch channel
        id: gen
        run: |
          set -euo pipefail
          python scripts/generate_matrix.py \
            --package "$IN_PACKAGE" --cuda "$IN_CUDA" \
            --pytorch "$IN_PYTORCH" --python "$IN_PYTHON" \
            --output matrix.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("matrix.json"))
          compile_jobs = [c for c in m if int(c.get("shard_count", 0)) > 0]
          link_jobs    = [c for c in m if int(c.get("shard_count", 0)) == 0] + \
                         [dict(c, shard_index=0) for c in m if int(c.get("shard_count", 0)) > 0
                          and int(c.get("shard_index", 0)) == 1]
          print(f"compile={json.dumps(compile_jobs)}")
          print(f"link={json.dumps(link_jobs)}")
          PY

  source:
    needs: matrix
    runs-on: ubuntu-latest
    env:
      IN_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Fetch and patch sources (outside the build sandbox)
        # Doing this here rather than with a `git:` source in the recipe is what
        # lets the build script run with no network at all: nothing legitimate
        # remains for it to download, so a prebuilt-wheel fetch has nowhere to
        # hide behind a real need.
        run: python scripts/fetch_patched_sources.py --package "$IN_PACKAGE" --output-dir staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ inputs.package }}
          path: staging/
          retention-days: 3

  compile-shard:
    needs: [matrix, source]
    if: needs.matrix.outputs.compile != '[]'
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.matrix.outputs.compile) }}
    name: "shard ${{ matrix.cell.shard_index }}/${{ matrix.cell.shard_count }} ${{ matrix.cell.package }} cu${{ matrix.cell.cuda_short }} torch${{ matrix.cell.pytorch }} py${{ matrix.cell.python }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-${{ inputs.package }}
          path: staging
      - uses: ./.github/actions/setup-conda-build
      - name: Compile slice
        env:
          CUW_MODE: shard
          CUW_SHARD_INDEX: ${{ matrix.cell.shard_index }}
          CUW_SHARD_COUNT: ${{ matrix.cell.shard_count }}
          CUW_SRC_TARBALL: ${{ github.workspace }}/staging/${{ matrix.cell.src_tarball }}
          # Family packages (torchvision/torchaudio) version with the torch
          # they build against, so the cell carries both and the recipe reads
          # them; for everything else these equal the package.yml values.
          CUW_VERSION: ${{ matrix.cell.version }}
          CUW_SOURCE_REV: ${{ matrix.cell.source_rev }}
          # conda-torch's libtorch hard-depends on the __cuda virtual
          # package, and a GitHub runner has no GPU, so the solve fails with
          # "__cuda *, for which no candidates were found". Declaring the
          # driver we are building FOR is the standard override; it affects
          # dependency resolution only, never the compile.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          CUW_TORCH_BUILD: ${{ matrix.cell.torch_build }}
          CUW_ARCH_LIST: ${{ matrix.cell.arch_list }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECIPE: recipes/${{ matrix.cell.package }}/recipe.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$RECIPE" ]; then
            echo "::error::recipe $RECIPE does not exist. The matrix cell names a package with no generated recipe -- run scripts/generate_recipes.py and commit, or check the matrix/recipe naming agree."
            exit 1
          fi
          # No --sandbox: it needs unprivileged namespaces, which hosted
          # runners do not provide ("sandboxing failure: Operation not
          # permitted", run 34095721769). The no-network guarantee is imposed
          # inside the build by scripts/build_snippets/nonet.py instead.
          rattler-build build --recipe "$RECIPE" \
            --variant-config defaults/variants.yaml \
            --variant cuda_compiler_version="${{ matrix.cell.cuda }}" \
            --variant pytorch="${{ matrix.cell.pytorch }}" \
            --variant python="${{ matrix.cell.python }}" \
            --target-platform "${{ matrix.cell.platform }}" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            -c https://comfy-forge.github.io/conda-torch -c conda-forge
      - name: Package shard cache
        run: tar -czf "$RUNNER_TEMP/ccache.tar.gz" -C "$CUW_CCACHE_DIR" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.shard_index }}
          path: ${{ runner.temp }}/ccache.tar.gz
          retention-days: 3

  link:
    needs: [matrix, source, compile-shard]
    # `always()` so unsharded cells (which have no compile-shard job) still run.
    if: always() && needs.matrix.outputs.link != '[]' && needs.source.result == 'success'
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.matrix.outputs.link) }}
    name: "link ${{ matrix.cell.package }} cu${{ matrix.cell.cuda_short }} torch${{ matrix.cell.pytorch }} py${{ matrix.cell.python }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-${{ inputs.package }}
          path: staging
      - uses: ./.github/actions/setup-conda-build
      - name: Restore shard caches
        if: matrix.cell.shard_count != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cache-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-*
          path: shard-caches
      - name: Merge shard caches
        if: matrix.cell.shard_count != '0'
        run: |
          set -euo pipefail
          found=0
          for t in shard-caches/*/ccache.tar.gz; do
            [ -f "$t" ] || continue
            found=$((found+1)); tar -xzf "$t" -C "$CUW_CCACHE_DIR"
          done
          [ "$found" -gt 0 ] || { echo "::error::no shard caches restored"; exit 1; }
          echo "merged $found shard cache(s)"
          # The tarballs carry each shard's stats files, which would pollute the
          # link job's zero-miss assert with the shards' own compile misses.
          "${CUW_CCACHE_BIN:-ccache}" -z
      - name: Build
        env:
          CUW_MODE: ${{ matrix.cell.shard_count != '0' && 'link' || 'full' }}
          CUW_SHARD_COUNT: "0"
          CUW_SRC_TARBALL: ${{ github.workspace }}/staging/${{ matrix.cell.src_tarball }}
          # Family packages (torchvision/torchaudio) version with the torch
          # they build against, so the cell carries both and the recipe reads
          # them; for everything else these equal the package.yml values.
          CUW_VERSION: ${{ matrix.cell.version }}
          CUW_SOURCE_REV: ${{ matrix.cell.source_rev }}
          # conda-torch's libtorch hard-depends on the __cuda virtual
          # package, and a GitHub runner has no GPU, so the solve fails with
          # "__cuda *, for which no candidates were found". Declaring the
          # driver we are building FOR is the standard override; it affects
          # dependency resolution only, never the compile.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          CUW_TORCH_BUILD: ${{ matrix.cell.torch_build }}
          CUW_ARCH_LIST: ${{ matrix.cell.arch_list }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECIPE: recipes/${{ matrix.cell.package }}/recipe.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$RECIPE" ]; then
            echo "::error::recipe $RECIPE does not exist. The matrix cell names a package with no generated recipe -- run scripts/generate_recipes.py and commit, or check the matrix/recipe naming agree."
            exit 1
          fi
          rattler-build build --recipe "$RECIPE" \
            --variant-config defaults/variants.yaml \
            --variant cuda_compiler_version="${{ matrix.cell.cuda }}" \
            --variant pytorch="${{ matrix.cell.pytorch }}" \
            --variant python="${{ matrix.cell.python }}" \
            --target-platform "${{ matrix.cell.platform }}" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            -c https://comfy-forge.github.io/conda-torch -c conda-forge
      - name: Provenance report
        # Printed unconditionally, before verification, because this is the
        # evidence that the artifact was built from source. If verification
        # later fails the .conda is not uploaded -- but the provenance still
        # has to be readable in the log, or diagnosing a failure means
        # re-running the whole build to see what it produced.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          python - "${files[@]}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import io, json, subprocess, sys, tarfile, zipfile
          for path in sys.argv[1:]:
              z = zipfile.ZipFile(path)
              name = [n for n in z.namelist() if n.startswith("info-")][0]
              # zstd CLI rather than a python module: same choice
              # tools/verify_conda.py makes, so this step adds no new dependency.
              raw = subprocess.run(["zstd", "-d", "--stdout"], input=z.read(name),
                                   stdout=subprocess.PIPE, check=True).stdout
              t = tarfile.open(fileobj=io.BytesIO(raw))
              about = json.load(t.extractfile("info/about.json"))
              print(f"## {path.rsplit('/', 1)[-1]}")
              print("```json")
              print(json.dumps(about.get("extra", {}), indent=2, sort_keys=True))
              print("```")
          PY
          echo "## compile ledger"
          echo '```'
          cat "$CUW_LEDGER" 2>/dev/null || echo "(no ledger at $CUW_LEDGER)"
          echo '```'

      - name: Verify artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          if [ -f tools/verify_conda.py ]; then
            python tools/verify_conda.py "${files[@]}"
          else
            echo "::warning::tools/verify_conda.py not present yet — artifact gate skipped"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conda-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}
          path: ${{ runner.temp }}/out/*/*.conda

  canary:
    # L4. Proves the no-network guarantee is in force, POSITIVELY.
    #
    # The first version inferred "network denied" from the canary build
    # FAILING. That passes whenever the mechanism is broken, and it did
    # exactly that on run 34095721769: it reported the guarantee in force
    # while the real cause was rattler-sandbox failing to start. So the
    # canary now has to SUCCEED and print a proof line, which means any
    # failure — including infrastructure failure — fails this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-conda-build
        with:
          swapfile-gb: "0"
      - name: Canary must SUCCEED and prove the guarantee
        run: |
          set -uo pipefail
          rattler-build build --recipe recipes/_canary_prebuilt/recipe.yaml \
               --output-dir "$RUNNER_TEMP/canary" --test skip --no-build-id \
               -c conda-forge 2>&1 | tee "$RUNNER_TEMP/canary.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::canary build FAILED (exit $rc). Either the no-network guard is broken, or it is too coarse and broke an ordinary build."
            exit 1
          fi
          if ! grep -q 'CANARY_RESULT=GUARANTEE_IN_FORCE' "$RUNNER_TEMP/canary.log"; then
            echo "::error::canary build succeeded but never printed its proof line -- the assertions did not run."
            exit 1
          fi
          echo "canary: guarantee proven in force (AF_INET refused, fetch refused, AF_UNIX intact)"
